# ==========================================
# 全局默认帮助菜单配置
# ==========================================

# 指定背景图路径（绝对路径，或者相对于 temp 文件夹的路径，比如 "card/bg1.jpg"）
# 如果留空 ""，代码会自动去 temp/card/ 文件夹里随机抽一张
default_bg: ""

# 遮罩层颜色 (RGBA格式)。最后一位是透明度，0~1之间。
# 建议设置在 0.5 ~ 0.8 之间，太低了文字会看不清
overlay_color: "rgba(0, 0, 0, 0.65)"

# 标题颜色（比如 "🌸 星缘机器人 · 帮助"）
title_color: "#ffffff"

# 普通文字和描述的颜色
text_color: "#dddddd"

# 指令名称的颜色
cmd_color: "#88d3ce"